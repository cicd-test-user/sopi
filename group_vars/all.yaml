# Ansibleの接続方式を指定（SSHではなく、AWS Systems Manager経由で接続）
ansible_connection: aws_ssm

# SSM経由のAnsible実行で使用される一時ファイル保存用のS3バケット名を指定
# モジュールの転送やログのやり取りに使用される
ansible_aws_ssm_bucket_name: rhel-batch

# SSMおよび対象のEC2インスタンスが存在するAWSリージョンを指定
# この設定はSSMセッションの開始に必要
ansible_aws_ssm_region: ap-northeast-1

# SSMセッション内でリモートコマンドを実行するユーザー名を指定
# 通常、Amazon EC2内に自動作成される 'ssm-user' を指定する
ansible_user: ssm-user
